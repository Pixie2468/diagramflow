[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yagnik", email = "coderisaddicted@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "main:app"

